# Render Blueprint: one free web service serving the frontend and /api on one origin (ADR-0005).
# Secrets are set in the Render dashboard (sync: false) or generated by Render, never committed.
services:
  - type: web
    name: boche
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    # Free instances have no pre-deploy hook, so migrations run at start. They are idempotent.
    # Render's proxy terminates HTTPS; --forwarded-allow-ips lets the app see the request as https.
    startCommand: python -m alembic -c backend/alembic.ini upgrade head && python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Signs (mock) payment confirmations; only the server and the mock provider know it.
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Public by design: the Google client ID is sent to every browser.
      - key: GOOGLE_CLIENT_ID
        value: 225166969003-9q66a10mk0kip7p55ll5uu2sit6vfmqb.apps.googleusercontent.com
      # Who may act as Admin (comma-separated). Re-read at every sign-in.
      - key: ADMIN_EMAILS
        value: deepakmanivannnan@gmail.com
      # Admin mobile numbers (comma-separated) that may sign in to the admin page with an SMS code. Codes go
      # only to these numbers. Personal data and this repository is public: set it in the dashboard only.
      - key: ADMIN_MOBILES
        sync: false
      # Public GitHub repository that receives each day's Seal at 8 PM (ADR-0003).
      - key: SEALS_REPO
        value: Deepak-Manivannnan/boche-draw-seals
      # Fine-grained token: Contents read/write on the seals repository only. Set in the dashboard.
      - key: SEALS_GITHUB_TOKEN
        sync: false
      # The Founder's OTP: our server makes a 4-digit code, MSG91's Flow API only delivers it.
      # Without SMS_MODE=msg91 (or a key/template) the OTP is written to the server log instead.
      - key: FOUNDER_MOBILE
        sync: false
      - key: SMS_MODE
        value: msg91
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        value: 6a8fb2b2bcf52c77450ebc42
      - key: MSG91_OTP_VARIABLE
        value: OTP
      - key: OTP_EXPIRY_MINUTES
        value: "10"
