[project]
name = "boche-lucky-draw"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".", "backend", "verifier"]
testpaths = ["backend/tests", "engine/tests", "verifier/tests"]
markers = ["network: needs internet access (drand relays); run with -m network, skipped by default"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "engine", "verify"]
