[project]
name = "boche-lucky-draw"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests", "engine/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "engine", "verify"]
